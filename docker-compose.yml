services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./.qdrant:/qdrant/storage"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    volumes: ["./data:/app/data"]

volumes:
  ollama:
